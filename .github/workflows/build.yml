name: Build Godsotv
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/godsotv
          AUTH_SECRET: build-only-secret-value-not-for-production
          AUTH_GITHUB_ID: build
          AUTH_GITHUB_SECRET: build
          GODSOTV_ADMIN_EMAILS: owner@example.com
